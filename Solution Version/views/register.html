<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SecureApp</title>

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- SITE HEADER -->
    <header class="site-header">
        <h1>Secure Login System</h1>
        <p>CSC429 Project</p>
    </header>


    <!-- MAIN CONTENT -->
    <main>
        <div class="card">

            <h2>Create Account</h2>
            <p class="subtitle">Fill in the details below to get started</p>

            <!-- ALERT CONTAINER: Empty div used to show erorr massages  -->
            <div id="alert-container"></div>


            <!-- REGISTRATION FORM -->
            <form action="/register" method="POST">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required
                        autocomplete="email">
                </div>

                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required
                        autocomplete="username">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Choose a password" required
                        autocomplete="new-password">
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn btn-primary">Create Account</button>

            </form>

            <!-- Link back to login page -->
            <p class="divider">
                Already have an account? <a href="/login">Sign in</a>
            </p>

        </div>
    </main>


    <!-- SITE FOOTER -->
    <footer class="site-footer">
        CSC429 Project
    </footer>


    <!-- SCRIPT: Show error messages from URL query params -->
    <script>
        const params = new URLSearchParams(window.location.search); // get the query part from the URL (?error=...)
        const error = params.get('error'); // try to get error message from URL
        const container = document.getElementById('alert-container'); // get the div where we will show the message

        if (error) { // if there is an error message
            // show error inside the container
            container.innerHTML = `<div class="alert alert-error">${error}</div>`;
        }
    </script>

</body>

</html>
