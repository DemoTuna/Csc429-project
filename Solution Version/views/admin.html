<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="site-header">
    <h1>Secure Login System</h1>
    <p>Admin Control Panel</p>
</header>

<main>
    <div class="dashboard-card">

        <!-- Title -->
        <h2>Admin Panel </h2>

        <p class="welcome-msg" id="admin-name">
            Loading admin info...
        </p>

        <!-- Admin badge -->
        <div style="margin-bottom:15px;">
            <span class="role-badge role-admin">ADMIN ACCESS</span>
        </div>

        <!-- Stats Section -->
        <div class="card" style="margin-top:15px; max-width:1000px; width:100%; margin:auto;">
            <h3>System Overview</h3>

            <div style="display:flex; gap:20px; margin-top:10px;">
                <div>
                    <strong>Total Users:</strong>
                    <p id="total-users">Loading...</p>
                </div>

                <div>
                    <strong>System Status:</strong>
                    <p style="color:green;">Active </p>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card" style="margin-top:15px; max-width: 900px;">
            <h3>Users List</h3>

            <table class="info-table">
                <thead>
    <tr>
        <td>Username</td>
        <td>Email</td>
        <td>Role</td>
        <td>Actions</td> 
    </tr>
</thead>

                <tbody id="users-table">
                    <tr>
                        <td colspan="3">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Buttons -->
        <div style="margin-top:20px;">
            <a href="/dashboard" class="btn btn-primary">Back to Dashboard</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>

    </div>
</main>

<footer class="site-footer">
    CSC429 Project
</footer>

<!-- SCRIPT -->
<script>

    //  Show admin name
    fetch('/api/user')
        .then(res => res.json())
        .then(user => {
            document.getElementById('admin-name').textContent =
                'Welcome, ' + user.full_name ;
        });

    //  Load users
    fetch('/api/users')
        .then(res => res.json())
        .then(users => {

            document.getElementById('total-users').textContent = users.length;

            let html = '';

           users.forEach(u => {
    html += `
        <tr>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>
                <button onclick="deleteUser('${u.username}')" class="btn btn-danger" style="padding:5px 10px;">
                    Delete
                </button>
            </td>
        </tr>
    `;
});;

            document.getElementById('users-table').innerHTML = html;
        });


        function deleteUser(username) {
    if (!confirm('Are you sure you want to delete this user?')) return;

    fetch('/api/delete-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        location.reload();
    })
    .catch(err => {
        alert('Error deleting user');
    });
}

</script>



</body>
</html>
